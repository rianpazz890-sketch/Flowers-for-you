<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowers For You 💜</title>
<style>
*{box-sizing:border-box}
:root{--night:#090b20;--purple:#b94cff;--pink:#ff8dc9}
body{margin:0;min-height:100vh;overflow:hidden;background:#08090d;color:white;font-family:Georgia,serif}
.scene{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;background:radial-gradient(circle at 88% 26%,#fff 0 9px,#dfe3ff 10px,#a6aaff22 27px,transparent 38px),linear-gradient(#111020 0%,#171332 38%,#0a1733 70%,#080b1a 100%)}
.scene:before{content:"";position:absolute;inset:0;background-image:radial-gradient(white 1px,transparent 1.6px),radial-gradient(#b8c8ff 1px,transparent 1.6px);background-size:59px 73px,97px 111px;background-position:8px 12px,41px 27px;opacity:.55}
.moon{position:absolute;right:-15px;top:22%;width:43px;height:43px;border-radius:50%;background:#fff;box-shadow:0 0 24px 9px #c9c9ff77}
h1{position:absolute;top:18%;left:0;width:100%;margin:0;text-align:center;font-size:clamp(2rem,8vw,3.5rem);font-style:italic;color:#c34aff;text-shadow:0 0 12px #a400ff;z-index:2}
.bouquet{position:absolute;left:50%;top:27%;width:260px;height:330px;transform:translateX(-50%);z-index:1}
.stem{position:absolute;left:50%;bottom:22px;width:5px;height:190px;border-radius:10px;background:linear-gradient(#4c9b4b,#16582e);transform-origin:bottom}
.leaf{position:absolute;bottom:75px;left:calc(50% - 5px);width:45px;height:18px;background:linear-gradient(45deg,#145a35,#5db65e);border-radius:100% 0 100% 0;transform:rotate(-24deg)}
.flower{position:absolute;width:50px;height:52px;left:50%;bottom:145px;transform:translateX(-50%);filter:drop-shadow(0 0 7px #b33cff);animation:sway 3s ease-in-out infinite alternate;transform-origin:bottom}
.flower:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#f0caff 0 9%,#d879ff 24%,#8a27d9 61%,#5010a0 100%);border-radius:55% 55% 48% 48%;box-shadow:-15px 7px 0 -3px #a94be9,15px 7px 0 -3px #9e3add,inset 0 -8px 9px #52109b}
.flower:after{content:"";position:absolute;left:22px;top:6px;width:7px;height:35px;border-radius:50%;background:#f1c5ff66}
.f1{left:24%;bottom:188px;transform:scale(.8);animation-delay:-1s}.f2{left:42%;bottom:220px;transform:scale(.95);animation-delay:-.4s}.f3{left:61%;bottom:192px;transform:scale(.82);animation-delay:-1.7s}.f4{left:76%;bottom:166px;transform:scale(.78);animation-delay:-.8s}.f5{left:51%;bottom:170px;transform:scale(.8);animation-delay:-2s}.f6{left:69%;bottom:244px;transform:scale(.9);animation-delay:-1.3s}
.wrap{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);width:min(88vw,460px);height:24px;background:#f58fcb;border-radius:5px;box-shadow:0 4px 0 #b94791;z-index:4}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%);width:min(82vw,430px);min-height:230px;padding:22px 20px 18px;background:#fff;color:#3e3540;border-radius:9px;border:2px solid #f2edf5;box-shadow:0 10px 28px #0008;z-index:5;text-align:left}
.card:before{content:"";position:absolute;inset:10px;border:2px dotted #aaa;border-radius:3px;pointer-events:none}
.card-inner{position:relative;z-index:1}
.card h2{font-family:Arial,sans-serif;font-size:14px;margin:0 0 5px}
.card p{font:11px/1.45 Arial,sans-serif;margin:0}
.couple{height:115px;display:flex;align-items:center;justify-content:center;font-size:65px;letter-spacing:-19px;filter:drop-shadow(0 2px 1px #ddd)}
.heart{color:#f27da8;font-size:19px;text-align:center;margin-top:-4px}
.bottom-text{margin-top:8px!important}
button{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);z-index:8;border:0;border-radius:30px;padding:12px 23px;background:#d84f9c;color:white;font-weight:bold;font-size:15px;box-shadow:0 5px 15px #0005}
button:active{transform:translateX(-50%) scale(.97)}
@keyframes sway{from{rotate:-5deg}to{rotate:5deg}}
@media(max-height:650px){h1{top:8%}.bouquet{top:19%;transform:translateX(-50%) scale(.78)}.card{top:49%;transform:translate(-50%,-35%) scale(.9)}.wrap{bottom:9%}button{bottom:2%}}
</style>
</head>
<body>
<main class="scene">
  <div class="moon"></div>
  <h1>Flowers For You</h1>
  <div class="bouquet" aria-label="Buket bunga ungu">
    <div class="stem"></div><div class="leaf"></div>
    <div class="flower f1"></div><div class="flower f2"></div>
    <div class="flower f3"></div><div class="flower f4"></div>
    <div class="flower f5"></div><div class="flower f6"></div>
  </div>
  <div class="wrap"></div>
  <section class="card">
    <div class="card-inner">
      <h2>Dear Love 💌</h2>
      <p>Today is not a special date, but for me it is a unique day.</p>
      <div class="heart">♥</div>
      <div class="couple" aria-label="Dua karakter lucu">🐻‍❣️🐼</div>
      <p class="bottom-text">I like you just the way you are. Happy month. 💜</p>
    </div>
  </section>
  <button onclick="showMessage()">Buka Pesan 💌</button>
</main>
<script>
function showMessage(){
 const card=document.querySelector('.card');
 const p=card.querySelector('.bottom-text');
 if(p.textContent.includes('I like you')){
   p.textContent='You make ordinary days feel special. Thank you for being you. 💗';
 }else{
   p.textContent='I like you just the way you are. Happy month. 💜';
 }
}
</script>
</body>
</html>
